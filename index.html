<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16303a">
<link rel="manifest" href="manifest.webmanifest"><title>المرجع الفني | أكواد الأعطال والكباسات</title>
<style>
:root{--ink:#16303a;--bg:#eef2f1;--card:#fff;--ac:#e8a317;--tx:#1b2428;--mu:#5b6b72;--ln:#d3dcdb;--bad:#b3261e;--ok:#1f7a4d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a1e;--card:#18262c;--tx:#e7eeee;--mu:#9bb0b5;--ln:#2b3d44}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Tajawal,"Noto Naskh Arabic",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--ink);color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
header a{color:#fff;text-decoration:none;font-weight:700;flex:1}header .lg{width:34px;height:34px;border:3px solid var(--ac);border-radius:50%;display:grid;place-items:center;color:var(--ac);font-weight:800}
main{max-width:760px;margin:auto;padding:14px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card)}
button,.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-block}
button.alt{background:transparent;color:var(--tx);border:1.5px solid var(--ln)}button.bad{background:var(--bad)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.big a{background:var(--ink);color:#fff;border-radius:16px;padding:22px 12px;text-decoration:none;font-weight:800;font-size:1.15rem;text-align:center;border-bottom:5px solid var(--ac)}
.big small{display:block;font-weight:400;opacity:.8}
.it{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:8px 0;display:block;color:inherit;text-decoration:none}
.it b{font-size:1.05rem}.mu{color:var(--mu);font-size:.9rem}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;background:var(--ln);margin-inline-end:4px}
.warn{background:#fff4d6;color:#5a4300;border-inline-start:5px solid var(--ac);padding:10px 12px;border-radius:8px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1}
h2{margin:18px 0 6px;font-size:1.1rem}.chips button{padding:6px 12px;min-height:34px;margin:2px}
dl{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:6px 12px}dt{color:var(--mu);font-size:.85rem;margin-top:8px}dd{margin:0 0 6px;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:.9rem}td,th{border:1px solid var(--ln);padding:6px;vertical-align:top}.df{background:#fff4d6;color:#3b2d00}
label{display:block;margin-top:10px;font-size:.9rem;color:var(--mu)}
</style></head><body>
<header><div class="lg">م</div><a href="#/">المرجع الفني</a><a href="#/settings" style="flex:0">⚙</a></header>
<main id="app"></main>
<script>
const FIELDS={
faults:[["type","نوع الجهاز",1],["brand","الشركة",1],["model","الموديل / السلسلة"],["code","كود العطل",1],["meaning","وصف العطل",1],["causes","الأسباب المحتملة","t"],["steps","خطوات الفحص بالترتيب","t"],["measures","القياسات المطلوبة","t"],["fixes","الحلول المحتملة","t"],["safety","تحذيرات السلامة","t"],["source","المصدر / الرابط"],["reviewed","تاريخ آخر مراجعة","d"],["verified","مؤكدة من مصدر موثوق (نعم/لا)"]],
comps:[["brand","الشركة",1],["model","رقم الموديل كما على اللوحة",1],["family","السلسلة"],["use","نوع الاستخدام"],["tech","نوع / تقنية الكباس"],["hp","القدرة (حصان)"],["cap","قدرة التبريد (W أو BTU/h)"],["gas","وسيط التبريد"],["volt","الجهد والتردد"],["amps","التيار المقنن وتيار البدء"],["oil","الزيت"],["cc","الإزاحة CC"],["cond","ظروف التشغيل المرجعية"],["wiring","التوصيلات الكهربائية","t"],["dims","الأبعاد / القطع البديلة"],["datasheet","رابط الداتا شيت"],["notes","ملاحظات البدائل والتوافق","t"],["source","المصدر"],["reviewed","تاريخ التحقق","d"]]};
const TYPES=["غسالة أوتوماتيك","غسالة نصف أوتوماتيك","ثلاجة / ديب فريزر","تكييف","مبرد مياه","سخان مياه","أخرى"];
const $=s=>document.querySelector(s),app=$("#app");
const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s??"").toLowerCase().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[\s\-_\/.]/g,"");
const S={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{alert("تعذر الحفظ: مساحة التخزين ممتلئة");return false}}};
const DEMO_SRC="بيانات تجريبية — غير موثّقة";
let db=S.get("mr_db",null)||{faults:[{id:"d1",demo:1,type:"غسالة أوتوماتيك",brand:"شركة تجريبية",model:"سلسلة X",code:"E-DEMO",meaning:"سجل تجريبي لعرض شكل الصفحة فقط",source:DEMO_SRC},{id:"d2",demo:1,type:"تكييف",brand:"شركة تجريبية",code:"E-DEMO",meaning:"نفس الكود بمعنى مختلف لتوضيح اختلاف الأكواد بين الشركات",source:DEMO_SRC}],
comps:[{id:"c1",demo:1,brand:"شركة تجريبية",model:"DEMO-100",gas:"—",source:DEMO_SRC},{id:"c2",demo:1,brand:"شركة تجريبية",model:"DEMO-200",gas:"—",source:DEMO_SRC}]};
const save=()=>S.set("mr_db",db);
let admin=false;const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hay=(r,k)=>norm(FIELDS[k].map(f=>r[f[0]]).join(" "));
const find=(k,q,flt={})=>{const n=norm(q);return db[k].filter(r=>(!n||hay(r,k).includes(n))&&Object.entries(flt).every(([a,b])=>!b||r[a]===b))};
const uniq=(k,f)=>[...new Set(db[k].map(r=>r[f]).filter(Boolean))].sort();
const item=(k,r)=>k=="faults"?`<a class="it" href="#/f/${r.id}"><b dir="ltr">${e(r.code)}</b> — ${e(r.meaning)}<div class="mu">${e(r.type)} · ${e(r.brand)} ${e(r.model||"")}</div>${r.demo?'<span class="tag">تجريبي</span>':""}${r.verified=="نعم"?"":'<span class="tag">غير مؤكد</span>'}</a>`:
`<div class="it"><label style="margin:0;display:flex;gap:8px;align-items:center;color:inherit"><input type="checkbox" class="cmp" value="${r.id}" style="width:22px;height:22px"><a href="#/c/${r.id}" style="color:inherit;text-decoration:none;flex:1"><b dir="ltr">${e(r.model)}</b><div class="mu">${e(r.brand)} ${e(r.family||"")} · ${e(r.gas||"")} ${e(r.volt||"")}</div>${r.demo?'<span class="tag">تجريبي</span>':""}</a></label></div>`;
const hist=(key,v,n=8)=>{let a=S.get(key,[]).filter(x=>x.id!==v.id&&x.q!==v.q);a.unshift(v);S.set(key,a.slice(0,n))};
function home(){const rs=S.get("mr_rs",[]),rv=S.get("mr_rv",[]),fv=S.get("mr_fv",[]);
app.innerHTML=`<form id="sf"><input id="q" type="search" placeholder="ابحث بكود عطل أو موديل كباس…" autocomplete="off"></form>
<div class="big"><a href="#/faults">أكواد الأعطال<small>${db.faults.length} سجل</small></a><a href="#/comps">الكباسات<small>${db.comps.length} سجل</small></a></div>
${db.faults.concat(db.comps).some(r=>r.demo)?'<div class="warn">البيانات الحالية تجريبية فقط وليست مرجعًا فنيًا. أضف بياناتك الموثّقة من الإدارة ثم احذف التجريبي.</div>':""}
<div id="res"></div>
${rs.length?`<h2>آخر عمليات البحث</h2><div class="chips">${rs.map(x=>`<button class="alt" data-q="${e(x.q)}">${e(x.q)}</button>`).join("")}</div>`:""}
${rv.length?`<h2>شاهدتها مؤخرًا</h2>${rv.map(x=>`<a class="it" href="${x.h}">${e(x.t)}</a>`).join("")}`:""}
${fv.length?`<h2>المفضلة</h2>${fv.map(x=>`<a class="it" href="${x.h}">${e(x.t)}</a>`).join("")}`:""}
<div class="row"><a class="btn alt" href="#/admin" style="text-align:center">الإدارة</a></div>`;
const q=$("#q"),res=$("#res");
q.oninput=()=>{const v=q.value;if(!v.trim()){res.innerHTML="";return}const f=find("faults",v).slice(0,15),c=find("comps",v).slice(0,15);
res.innerHTML=(f.length?`<h2>أعطال</h2>`+f.map(r=>item("faults",r)).join(""):"")+(c.length?`<h2>كباسات</h2>`+c.map(r=>item("comps",r)).join(""):"")||'<div class="it mu">لا نتائج. جرّب جزءًا من الكود أو الموديل.</div>'};
$("#sf").onsubmit=ev=>{ev.preventDefault();if(q.value.trim())hist("mr_rs",{q:q.value.trim()})};
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{q.value=b.dataset.q;q.oninput()})}
function list(k){const types=uniq(k,k=="faults"?"type":"gas"),brands=uniq(k,"brand"),ff=k=="faults"?"type":"gas";
app.innerHTML=`<h2>${k=="faults"?"أكواد الأعطال":"الكباسات"}</h2><input id="q" type="search" placeholder="بحث…" autocomplete="off">
<div class="row"><select id="a"><option value="">${k=="faults"?"كل الأجهزة":"كل الغازات"}</option>${types.map(x=>`<option>${e(x)}</option>`).join("")}</select><select id="b"><option value="">كل الشركات</option>${brands.map(x=>`<option>${e(x)}</option>`).join("")}</select></div>
${k=="comps"?'<div class="row"><button id="cmpb" class="alt">قارن المحدد</button></div><div class="warn">الحصان وحده لا يحدد البديل المتوافق: راجع وسيط التبريد والجهد وظروف التشغيل ومتطلبات الشركة.</div>':""}<div id="res"></div>`;
const go=()=>{const r=find(k,$("#q").value,{[ff]:$("#a").value,brand:$("#b").value});$("#res").innerHTML=r.map(x=>item(k,x)).join("")||'<div class="it mu">لا نتائج</div>';if($("#q").value.trim())hist("mr_rs",{q:$("#q").value.trim()})};
["q","a","b"].forEach(i=>$("#"+i).oninput=go);go();
if(k=="comps")$("#cmpb").onclick=()=>{const ids=[...document.querySelectorAll(".cmp:checked")].map(x=>x.value);if(ids.length<2)return alert("اختر كباسين على الأقل");location.hash="#/cmp/"+ids.join(",")}}
function detail(k,id){const r=db[k].find(x=>x.id==id);if(!r){app.innerHTML='<div class="it">السجل غير موجود</div>';return}
const t=k=="faults"?`${r.code} — ${r.brand}`:`${r.model} — ${r.brand}`,h=`#/${k=="faults"?"f":"c"}/${id}`;hist("mr_rv",{id,t,h});
const fv=S.get("mr_fv",[]).some(x=>x.id==id);
app.innerHTML=`<h2 dir="ltr" style="text-align:right">${e(t)}</h2>${r.demo?'<div class="warn">سجل تجريبي — لا تعتمد عليه.</div>':""}
${k=="faults"&&r.verified!="نعم"?'<div class="warn">هذه المعلومة غير مؤكدة أو لا تتوفر لها وثيقة موثوقة. لا تفترض أن الكود يعني الشيء نفسه عند كل الشركات والموديلات.</div>':""}
${k=="comps"?'<div class="warn">لا تعتمد على الحصان وحده لاختيار بديل. تأكد من الغاز والجهد وظروف التشغيل.</div>':""}
<dl>${FIELDS[k].map(([f,l])=>r[f]?`<dt>${l}</dt><dd>${/^https?:/.test(r[f])?`<a href="${e(r[f])}" rel="noopener" target="_blank">${e(r[f])}</a>`:e(r[f])}</dd>`:"").join("")}${r.updated?`<dt>آخر تعديل</dt><dd>${e(r.updated)}</dd>`:""}</dl>
<div class="row"><button id="cp">نسخ</button><button id="fv" class="alt">${fv?"إزالة من المفضلة":"إضافة للمفضلة"}</button><button id="sh" class="alt">مشاركة الرابط</button></div>
${admin?`<div class="row"><a class="btn alt" href="#/edit/${k}/${id}">تعديل</a><button class="bad" id="del">حذف</button></div>`:""}
${k=="faults"?(()=>{const s=db.faults.filter(x=>x.id!=id&&norm(x.code)==norm(r.code));return s.length?`<h2>نفس الكود عند جهات أخرى</h2>`+s.map(x=>item("faults",x)).join(""):""})():""}`;
$("#cp").onclick=()=>navigator.clipboard.writeText(FIELDS[k].filter(([f])=>r[f]).map(([f,l])=>l+": "+r[f]).join("\n")).then(()=>alert("تم النسخ"),()=>alert("تعذر النسخ"));
$("#fv").onclick=()=>{let a=S.get("mr_fv",[]).filter(x=>x.id!=id);if(!fv)a.unshift({id,t,h});S.set("mr_fv",a);detail(k,id)};
$("#sh").onclick=()=>{const u=location.href;navigator.share?navigator.share({title:t,url:u}).catch(()=>{}):navigator.clipboard.writeText(u).then(()=>alert("تم نسخ الرابط"))};
if(admin)$("#del").onclick=()=>{if(confirm("حذف نهائي؟")){snap();db[k]=db[k].filter(x=>x.id!=id);save();location.hash="#/"+(k=="faults"?"faults":"comps")}}}
function cmp(ids){const rs=ids.split(",").map(i=>db.comps.find(x=>x.id==i)).filter(Boolean);const fs=FIELDS.comps.filter(([f])=>f!="notes");
app.innerHTML=`<h2>مقارنة الكباسات</h2><div class="warn">الفروق ملوّنة. الحصان المتشابه لا يعني التكافؤ.</div><div style="overflow-x:auto"><table><tr><th></th>${rs.map(r=>`<th dir="ltr">${e(r.model)}</th>`).join("")}</tr>${fs.map(([f,l])=>{const v=rs.map(r=>r[f]||"—"),d=new Set(v).size>1;return`<tr><td>${l}</td>${v.map(x=>`<td class="${d?"df":""}">${e(x)}</td>`).join("")}</tr>`}).join("")}</table></div>`}
const need=k=>FIELDS[k].filter(f=>f[2]===1).map(f=>f[0]);
const dupKey=(k,r)=>norm(k=="faults"?[r.brand,r.model,r.code,r.type].join("|"):[r.brand,r.model].join("|"));
function form(k,id){if(!admin)return location.hash="#/admin";const r=id?db[k].find(x=>x.id==id):{};
app.innerHTML=`<h2>${id?"تعديل":"إضافة"} ${k=="faults"?"عطل":"كباس"}</h2><form id="f">${FIELDS[k].map(([f,l,o])=>`<label>${l}${o===1?" *":""}${f=="type"?`<select name="${f}">${TYPES.map(t=>`<option ${r[f]==t?"selected":""}>${t}</option>`).join("")}</select>`:o=="t"?`<textarea name="${f}" rows="3">${e(r[f])}</textarea>`:`<input name="${f}" type="${o=="d"?"date":"text"}" value="${e(r[f])}">`}</label>`).join("")}
<div class="row"><button>حفظ</button><a class="btn alt" href="#/admin" style="text-align:center">إلغاء</a></div></form>`;
$("#f").onsubmit=ev=>{ev.preventDefault();const n=Object.fromEntries([...new FormData(ev.target)].map(([a,b])=>[a,b.trim()]));const miss=need(k).filter(x=>!n[x]);
if(miss.length)return alert("حقول أساسية ناقصة: "+miss.map(m=>FIELDS[k].find(f=>f[0]==m)[1]).join("، "));
if(db[k].some(x=>x.id!=id&&dupKey(k,x)==dupKey(k,n))&&!confirm("يوجد سجل مكرر بنفس البيانات الأساسية. حفظ على أي حال؟"))return;
if(!n.source&&!confirm("لا يوجد مصدر. سيُعرض السجل كغير مؤكد. متابعة؟"))return;
snap();n.updated=new Date().toISOString().slice(0,10);if(id)Object.assign(r,n),delete r.demo;else db[k].push({id:uid(),...n});save();location.hash="#/admin"}}
function snap(){const b=S.get("mr_bak",[]);b.unshift({t:new Date().toISOString(),db});S.set("mr_bak",b.slice(0,5))}
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
async function adminPage(){if(!crypto.subtle)return app.innerHTML='<div class="warn">الإدارة تتطلب اتصالًا آمنًا (HTTPS).</div>';
const cred=S.get("mr_adm",null);
if(!admin){app.innerHTML=`<h2>${cred?"دخول الإدارة":"إنشاء كلمة مرور الإدارة"}</h2><input id="pw" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)"><div class="row"><button id="go">${cred?"دخول":"حفظ ومتابعة"}</button></div><div class="mu">القفل محلي على هذا الجهاز ويمنع التعديل العرضي فقط. الحماية الحقيقية لبيانات مشتركة تحتاج خادمًا (انظر README).</div>`;
$("#go").onclick=async()=>{const p=$("#pw").value;if(p.length<8)return alert("كلمة المرور قصيرة");
if(!cred){const salt=uid()+uid();S.set("mr_adm",{salt,h:await sha(salt+p)});admin=true}else if(await sha(cred.salt+p)==cred.h)admin=true;else return alert("كلمة مرور خاطئة");adminPage()};return}
const bak=S.get("mr_bak",[]);
app.innerHTML=`<h2>الإدارة</h2><div class="row"><a class="btn" href="#/new/faults" style="text-align:center">+ عطل</a><a class="btn" href="#/new/comps" style="text-align:center">+ كباس</a></div>
<h2>استيراد (JSON أو CSV)</h2><select id="ik"><option value="faults">أعطال</option><option value="comps">كباسات</option></select><input id="fi" type="file" accept=".json,.csv"><div id="rep"></div>
<h2>تصدير</h2><div class="row"><button class="alt" data-x="faults.json">أعطال JSON</button><button class="alt" data-x="faults.csv">أعطال CSV</button><button class="alt" data-x="comps.json">كباسات JSON</button><button class="alt" data-x="comps.csv">كباسات CSV</button><button class="alt" data-x="all.json">نسخة كاملة</button></div>
<h2>نسخ احتياطي</h2><div class="row"><button id="bk" class="alt">نسخة الآن</button></div>${bak.map((b,i)=>`<div class="it">${e(b.t.slice(0,16).replace("T"," "))} — ${b.db.faults.length} عطل / ${b.db.comps.length} كباس <button data-r="${i}" class="alt">استعادة</button></div>`).join("")}
<div class="row"><button id="dd" class="alt">فحص التكرار</button><button id="dm" class="alt">حذف السجلات التجريبية</button><button id="lo" class="alt">خروج</button></div><div id="out"></div>`;
$("#fi").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const k=$("#ik").value,txt=await f.text();let rows=[];
try{rows=f.name.endsWith(".json")?(()=>{const j=JSON.parse(txt);return Array.isArray(j)?j:j[k]||[]})():csv(txt)}catch(x){return $("#rep").innerHTML='<div class="warn">ملف غير صالح: '+e(x.message)+"</div>"}
snap();let ok=0,dup=[],err=[];const keys=new Set(db[k].map(r=>dupKey(k,r)));
rows.forEach((r,i)=>{const n={};FIELDS[k].forEach(([x])=>{if(r[x]!=null&&r[x]!=="")n[x]=String(r[x]).trim()});const m=need(k).filter(x=>!n[x]);
if(m.length)return err.push(`سطر ${i+1}: ينقص ${m.join("، ")}`);const dk=dupKey(k,n);if(keys.has(dk))return dup.push(`سطر ${i+1}`);keys.add(dk);n.id=uid();n.updated=new Date().toISOString().slice(0,10);db[k].push(n);ok++});
save();$("#rep").innerHTML=`<div class="warn">تم استيراد ${ok} · مكرر ${dup.length} · أخطاء ${err.length}<br>${[...dup.map(d=>d+": مكرر"),...err].map(e).join("<br>")}</div>`};
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const n=b.dataset.x,[k,x]=n.split(".");const d=k=="all"?db:db[k];dl(n,x=="json"?JSON.stringify(d,null,1):toCsv(k,d),x=="json"?"application/json":"text/csv")});
$("#bk").onclick=()=>{snap();adminPage()};
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(confirm("استعادة هذه النسخة؟ (تؤخذ نسخة من الحالة الحالية أولًا)")){const x=bak[b.dataset.r].db;snap();db=x;save();adminPage()}});

function csv(t){const rows=[];let r=[],c="",q=false;t=t.replace(/^\uFEFF/,"");for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){t[i+1]=='"'?(c+='"',i++):q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);rows.push(r);r=[];c=""}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}
const h=rows.shift().map(x=>x.trim());return rows.filter(a=>a.some(x=>x.trim())).map(a=>Object.fromEntries(h.map((x,i)=>[x,a[i]])))}
const toCsv=(k,d)=>{const fs=FIELDS[k].map(f=>f[0]);return "\uFEFF"+[fs.join(","),...d.map(r=>fs.map(f=>'"'+String(r[f]??"").replace(/"/g,'""')+'"').join(","))].join("\r\n")};
function dl(n,c,m){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:m+";charset=utf-8"}));a.download=n;a.click()}
